name: PHPUnit

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup PHP (latest 8.3.x)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: xdebug
          coverage: xdebug

      - name: Install composer and dependencies
        uses: php-actions/composer@v6
        with:
          php_version: "8.3"

      - name: PHPUnit Tests
        uses: php-actions/phpunit@v3
        env:
          XDEBUG_MODE: coverage
        with:
          bootstrap: vendor/autoload.php
          configuration: phpunit.xml
          php_version: "8.3"
          php_extensions: xdebug
          args: tests --coverage-clover coverage.xml

      - name: Scrutinizer
        run: composer global require scrutinizer/ocular && ~/.composer/vendor/bin/ocular code-coverage:upload --format=php-clover coverage.xml
        shell: bash
